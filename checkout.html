<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyStore - Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">🛍️ MyStore</div>
    <nav class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html">Cart <span id="cart-count" class="cart-badge">0</span></a></li>
      </ul>
    </nav>
  </header>

  <section class="checkout-page">
    <h1>Checkout</h1>
    <form class="checkout-form" id="checkout-form" action="#" method="post" novalidate>

      <label for="name">Name</label>
      <input type="text" id="name" name="name">
      <span class="error-message" id="name-error"></span>

      <label for="address">Address</label>
      <input type="text" id="address" name="address">
      <span class="error-message" id="address-error"></span>

      <label for="city">City</label>
      <input type="text" id="city" name="city">

      <label for="pincode">Pincode</label>
      <input type="text" id="pincode" name="pincode" maxlength="6">
      <span class="error-message" id="pincode-error"></span>

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" maxlength="10">
      <span class="error-message" id="phone-error"></span>

      <fieldset class="payment-method">
        <legend>Payment Method</legend>
        <label><input type="radio" name="payment" value="cod" checked> Cash on Delivery</label>
        <label><input type="radio" name="payment" value="card"> Credit/Debit Card</label>
        <label><input type="radio" name="payment" value="upi"> UPI</label>
      </fieldset>

      <button type="submit" class="btn">Place Order</button>
    </form>

    <div id="order-confirmation" class="confirmation-message" hidden>
      <h2>✅ Order placed!</h2>
      <p>Thank you for shopping with MyStore. A confirmation will be sent shortly.</p>
      <a href="index.html" class="btn">Back to Home</a>
    </div>
  </section>

  <footer class="site-footer">
    <p>Contact us: support@mystore.com | +91-98765-43210</p>
    <p>&copy; 2026 MyStore. All rights reserved.</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
